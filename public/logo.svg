<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="r"><rect width="512" height="512" rx="104"/></clipPath>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#r)">
    <!-- Portuguese flag colours: green (2/5) and red (3/5) -->
    <rect width="512" height="512" fill="#DA291C"/>
    <rect width="205" height="512" fill="#046A38"/>
    <rect width="512" height="512" fill="url(#shade)"/>
    <!-- film strip -->
    <rect x="96" y="132" width="320" height="248" rx="28" fill="#111" opacity="0.92"/>
    <g fill="#FFD100">
      <rect x="116" y="150" width="26" height="20" rx="4"/>
      <rect x="116" y="196" width="26" height="20" rx="4"/>
      <rect x="116" y="242" width="26" height="20" rx="4"/>
      <rect x="116" y="288" width="26" height="20" rx="4"/>
      <rect x="116" y="334" width="26" height="20" rx="4"/>
      <rect x="370" y="150" width="26" height="20" rx="4"/>
      <rect x="370" y="196" width="26" height="20" rx="4"/>
      <rect x="370" y="242" width="26" height="20" rx="4"/>
      <rect x="370" y="288" width="26" height="20" rx="4"/>
      <rect x="370" y="334" width="26" height="20" rx="4"/>
    </g>
    <!-- play button -->
    <path d="M226 196 L314 256 L226 316 Z" fill="#fff"/>
    <!-- PT label -->
    <text x="256" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900"
          font-size="88" fill="#fff" letter-spacing="6">PT</text>
  </g>
</svg>
